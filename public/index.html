<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Chatbot UI</title>
    <link rel="stylesheet" href="chatbot.css">
    <link rel="stylesheet" href="chatbot-expanded.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-window" id="chatWindow">
            <div class="chat-messages" id="chatMessages"></div>
        </div>
        <div class="chatbot-bar">
            <button class="chatbot-edit-icon">
                <img src="Edit.png" alt="Edit">
            </button>
            <input type="text" class="chatbot-input" id="chatbotInput" placeholder="Написать...">
            <button class="chatbot-send" id="chatSend">
                <img src="gpt.gif" alt="GPT" class="gpt-icon">
            </button>
            <button class="chatbot-voice">
                <img src="Mic.png" alt="Mic">
            </button>
            <button class="chatbot-back" id="chatBack">
                <img src="back.png" alt="Back">
            </button>
        </div>
    </div>

    <script src="chatbot-storage.js"></script>
    <script src="chatbot-ai.js"></script>
    <script src="chatbot.js"></script> 
</body>
</html>
